# Infrastructure (redis, mysql, kafka) starts with a plain `docker compose up`.
# The three application services are behind the "apps" profile:
#   docker compose --profile apps up --build
# Containers reach each other by service name on rideflow-net (kafka:29092, redis, mysql, ...).
name: rideflow

services:
  redis:
    image: redis:7-alpine
    container_name: rideflow-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rideflow-net

  mysql:
    image: mysql:8.0
    container_name: rideflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - rideflow-net

  # Single-node Kafka in KRaft mode (no Zookeeper).
  # PLAINTEXT      -> kafka:29092     for containers on the shared network
  # PLAINTEXT_HOST -> localhost:9092  for apps running on the host
  kafka:
    image: apache/kafka:3.7.0
    container_name: rideflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - rideflow-net

  # ---------------------------------------------------------------------------------------------
  # Application services (profile "apps"). Build context is the repo root because of libs/common-events.
  # Hostnames below are the container names on rideflow-net, NOT the localhost values from .env.
  # ---------------------------------------------------------------------------------------------
  location-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: services/location-service/Dockerfile
    image: rideflow/location-service:dev
    container_name: rideflow-location-service
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8082:8082"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - rideflow-net

  ride-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: services/ride-service/Dockerfile
    image: rideflow/ride-service:dev
    container_name: rideflow-ride-service
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - rideflow-net

  matching-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: services/matching-service/Dockerfile
    image: rideflow/matching-service:dev
    container_name: rideflow-matching-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOCATION_SERVICE_URL: http://location-service:8082
    ports:
      - "8084:8084"
    depends_on:
      kafka:
        condition: service_healthy
      location-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - rideflow-net

volumes:
  redis-data:
  mysql-data:
  kafka-data:

networks:
  rideflow-net:
    driver: bridge
