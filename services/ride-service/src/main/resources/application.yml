server:
  port: 8083

spring:
  application:
    name: ride-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${MYSQL_DATABASE:ride_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ride-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.ayshriv.events
        spring.json.use.type.headers: false
    listener:
      ack-mode: record
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false

ride:
  matching:
    # A ride gets this many matching attempts in total before it becomes NO_DRIVER_FOUND.
    max-attempts: 3
    # A MATCHING ride with no result for this long is retried (also recovers lost Kafka messages).
    retry-delay-seconds: 15
    scheduler-interval-seconds: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
