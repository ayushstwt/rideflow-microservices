server:
  port: 8082

spring:
  application:
    name: location-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info

location:
  # A driver is considered offline when no update arrived within this window.
  driver-ttl-seconds: 30
